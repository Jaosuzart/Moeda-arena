<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Administração da Loja Moeda Arena - Gerencie usuários, tokens e planos de forma segura e eficiente." />
    <title>Admin Dashboard - Moeda Arena</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="bg-dark text-light">
    <nav class="navbar">
      <div class="nav-container">
        <a href="/" class="logo">
          MOEDA ARENA
          <span class="text-warning">ADMIN</span>
        </a>
        <div class="nav-links">
          <a href="/" class="btn-secundario text-decoration-none">Voltar para Loja</a>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <div class="card bg-secondary border-0 shadow-lg">
        <div class="card-header bg-dark border-secondary d-flex justify-content-between align-items-center py-3">
          <h4 class="mb-0 text-warning">Gerenciamento de Usuários</h4>
          <span class="badge bg-warning text-dark">Área Restrita</span>
        </div>
        <div class="card-body bg-dark">
          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0" id="tabelaUsuarios">
              <thead class="table-secondary">
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Nome</th>
                  <th scope="col">Email</th>
                  <th scope="col">Tokens</th>
                  <th scope="col">Plano</th>
                  <th scope="col">Afiliados (Ganho)</th>
                  <th scope="col" class="text-end">Ações</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="7" class="text-center py-4">
                    <div class="spinner-border text-warning" role="status">
                      <span class="visually-hidden">Carregando...</span>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
